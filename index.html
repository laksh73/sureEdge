<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SureEdge - Arbitrage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SureEdge</h1>
        <p>Smart Arbitrage Calculator</p>
    </header>

    <main>

        <section class="calculator">
            <h2>Enter Your Bets</h2>

            <div class="input-group">
                <label for="odds1">Bet 1 Odds</label>
                <input type="number" id="odds1" placeholder="Enter odds" step="0.01" min="1.01" required>
            </div>

            <div class="input-group">
                <label for="odds2">Bet 2 Odds</label>
                <input type="number" id="odds2" placeholder="Enter odds" step="0.01" min="1.01" required>
            </div>

            <div class="input-group">
                <label for="stake">Total Stake</label>
                <input type="number" id="stake" placeholder="Enter total stake" step="0.01" min="0.01" required>
            </div>


            <div class="buttons">
                <button type="button" id="calculateBtn">Calculate</button>
                <button type="button" id="resetBtn">Reset</button>
                <button type="button" id="addBetBtn">More Bets</button>
            </div>

            <p id="errorMessage"></p>

        </section>

        <p id="arbitrageStatus"></p>

        <section class="results">
            <h2>Results</h2>

            <div id="betStakesResults"></div>

            <div class="result-box">
                <p>Total Payout</p>
                <strong id="totalPayout">0.00</strong>
            </div>

            <div class="result-box">
                <p>Profit / Loss</p>
                <strong id="profitLoss">0.00</strong>
            </div>

            <div class="result-box">
                <p>ROI</p>
                <strong id="roi">0.00%</strong>
            </div>
        </section>
    </main>

    <footer>
        <p>Arbitrage Calculator - College Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
